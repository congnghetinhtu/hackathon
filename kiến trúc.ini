**Chốt CareVault theo kiến trúc hợp nhất dưới đây:** giữ bốn công năng của nhóm, bổ sung API nghiệp vụ, phân quyền theo từng hồ sơ và tách rõ cơ chế quản trị Tide với hội đồng y khoa. Đây là **bản thiết kế để triển khai**; những khả năng phụ thuộc SDK phải được kiểm chứng trước khi công bố đã hoàn thành.

**1. Mục tiêu và phạm vi**

CareVault cho phép bệnh nhân quản lý hồ sơ, chia sẻ tài liệu cho bác sĩ theo thời hạn, thu hồi quyền truy cập trong tương lai và theo dõi các điều chỉnh bệnh án được phê duyệt.

Prototype tập trung vào:

- Mã hóa và giải mã hồ sơ bằng tích hợp Tide.
- Chia sẻ đúng người, đúng tài liệu, đúng thời hạn.
- Thu hồi và kiểm tra truy cập sau thu hồi.
- Phê duyệt đính chính bệnh án với hai trong ba thành viên.
- Lịch sử truy cập và phiên bản có thể kiểm tra.

Dùng dữ liệu y tế giả lập. Các chức năng cấp cứu, tích hợp bệnh viện thật và đánh giá tuân thủ thuộc giai đoạn sau.

**2. Sơ đồ kiến trúc thống nhất**

```mermaid
flowchart TB
    subgraph CLIENT["Tầng người dùng"]
        UI["CareVault Web App"]
        SDK["Tide SDK và thành phần bảo mật"]
        UI <--> SDK
    end

    subgraph AUTH["Tầng danh tính và mật mã"]
        IAM["TideCloak IAM và QEA"]
        FAB["Tide Fabric"]
        IAM <--> FAB
    end

    subgraph APP["Tầng nghiệp vụ CareVault"]
        API["API xác thực và phân quyền"]
        GRANT["Quản lý chia sẻ và thu hồi"]
        GOV["Workflow hội đồng y khoa"]
        API --> GRANT
        API --> GOV
    end

    subgraph DATA["Tầng dữ liệu"]
        DB["PostgreSQL"]
        OBJ["Object Storage chứa ciphertext"]
        AUD["Nhật ký và bằng chứng kiểm toán"]
    end

    SDK <--> IAM
    SDK <--> FAB
    UI --> API
    API -->|"Xác minh token"| IAM
    API --> OBJ
    GRANT --> DB
    GRANT -->|"Đồng bộ chính sách được hỗ trợ"| IAM
    GOV --> DB
    API --> AUD
```

Các đường nối SDK–Tide là quan hệ trách nhiệm; đường gọi thực tế tuân theo SDK được triển khai.

**3. Công nghệ và trách nhiệm từng tầng**

| Tầng | Công nghệ thống nhất | Trách nhiệm |
|---|---|---|
| Giao diện | React, TypeScript, Vite, Tailwind, shadcn/ui | Hồ sơ, chia sẻ, thu hồi, bác sĩ, hội đồng |
| Tích hợp Tide | `@tidecloak/react` theo phiên bản đã kiểm chứng | Đăng nhập và thao tác mật mã được SDK hỗ trợ |
| Backend | Node.js, TypeScript, Fastify | API, kiểm tra quyền, workflow và điều phối |
| Database | PostgreSQL | Metadata tối thiểu, quyền chia sẻ, phiên bản, trạng thái |
| Lưu file | MinIO hoặc S3-compatible | Tài liệu đã mã hóa |
| Kiểm thử | Kiểm thử API và Playwright | Kiểm tra luồng hợp lệ và truy cập trái phép |
| Triển khai | Docker Compose cho các thành phần nhóm vận hành | Khởi động, cấu hình và phục hồi demo |

Backend là **một ứng dụng chia module**, gồm `identity`, `records`, `grants`, `governance` và `audit`. Chưa cần microservices.

**4. Ranh giới tin cậy**

Các nguyên tắc bắt buộc:

1. **Frontend không quyết định quyền.** Ẩn nút hoặc đổi React Context chỉ thay đổi giao diện.
2. **API kiểm tra mọi yêu cầu.** Không tin `patient_id`, `role` hoặc `status` do client gửi.
3. **Quyền tải ciphertext và quyền giải mã là hai kiểm soát riêng.**
4. **Database không lưu khóa giải mã đầy đủ hoặc nội dung hồ sơ bản rõ.**
5. **Backend không được làm dịch vụ giải mã thay người dùng** trong luồng E2EE đã chọn.
6. **Trạng thái phê duyệt trong database không tự trở thành bằng chứng mật mã.**
7. Quản trị viên vẫn có thể gây gián đoạn hoặc phá hoại lưu trữ; cần sao lưu và kiểm tra tính toàn vẹn.

Không gọi toàn bộ ứng dụng React là “enclave”; chỉ dùng thuật ngữ đó cho thành phần bảo mật tương ứng của Tide.

**5. Danh tính và phân quyền**

Vai trò nghiệp vụ:

| Vai trò | Quyền chính |
|---|---|
| Bệnh nhân | Quản lý hồ sơ của mình; cấp và thu hồi chia sẻ |
| Bác sĩ | Xem đúng tài liệu được cấp; yêu cầu bổ sung; đề xuất đính chính |
| Thành viên hội đồng | Xem phạm vi cần thiết và biểu quyết yêu cầu được giao |
| Quản trị vận hành | Vận hành hệ thống; không mặc định có quyền đọc hồ sơ |
| Quản trị Tide realm | Quản lý các thay đổi IAM theo QEA; tách khỏi vai trò hội đồng |

Một quyền chia sẻ phải chứa:

```text
grant_id
patient_id
recipient_id
record_version_ids
allowed_actions
purpose
expires_at
status
policy_reference
policy_version
```

**Mặc định chia sẻ các phiên bản tài liệu cụ thể.** Phiên bản mới không tự động được chia sẻ nếu chưa có chính sách rõ ràng.

Điều kiện cho phép:

```text
Danh tính hợp lệ
AND đúng người nhận
AND đúng phiên bản tài liệu
AND đúng hành động
AND quyền đang hoạt động
AND chưa hết hạn
AND chưa bị thu hồi
```

Chuyên khoa giúp lọc và gợi ý hồ sơ, không thay thế quyền theo từng bệnh nhân.

**6. Luồng mã hóa và lưu hồ sơ**

1. Người dùng đăng nhập bằng tài khoản Tide.
2. Chọn tài liệu và nhập thông tin.
3. Client sử dụng SDK để mã hóa theo chính sách đã xác minh.
4. Client tải ciphertext lên object storage.
5. API lưu metadata tối thiểu và hash của ciphertext.
6. Hồ sơ chỉ chuyển sang sẵn sàng khi việc lưu file và metadata hoàn tất.

Thông tin nhạy cảm như tên tài liệu, chẩn đoán và ghi chú cần được mã hóa khi không cần dùng ở phía máy chủ.

Không ghi bản rõ vào `localStorage`, `sessionStorage`, log hoặc hệ thống phân tích hành vi. Dữ liệu giả lập không được đóng gói công khai trong frontend nếu dùng demo để chứng minh tính bí mật.

**Điều kiện chốt tích hợp:** phải chạy được luồng **bệnh nhân A mã hóa, bác sĩ B được giải mã, người C bị từ chối**. Tài liệu E2EE của Tide có hướng dẫn SDK và quyền theo tag; không được suy ra rằng ví dụ tự mã hóa/tự giải mã đã giải quyết chia sẻ khác người dùng. [docs.tide.org](https://docs.tide.org/Admin/e2ee?utm_source=chatgpt.com)

**7. Luồng cấp quyền và thu hồi**

Quyền chia sẻ sử dụng các trạng thái:

```text
PENDING → ACTIVE → REVOKING → REVOKED
                  └────────→ EXPIRED
```

| Thao tác | Cách thực hiện |
|---|---|
| Cấp quyền | Kiểm tra chủ hồ sơ → tạo yêu cầu → cập nhật chính sách mật mã → xác nhận → chuyển `ACTIVE` |
| Đọc hồ sơ | Xác minh token → kiểm tra grant → lấy ciphertext → giải mã qua SDK nếu đủ quyền |
| Thu hồi | Chuyển `REVOKING` và chặn API → cập nhật chính sách mật mã → xác nhận → chuyển `REVOKED` |
| Đồng bộ thất bại | Giữ trạng thái chưa hoàn tất, chặn theo hướng an toàn và cho phép thử lại |
| Hết hạn | API kiểm tra thời gian trên mỗi yêu cầu; không phụ thuộc riêng tác vụ chạy định kỳ |

Không hiển thị “Đã thu hồi” khi mới cập nhật database nhưng lớp giải mã chưa xác nhận.

**Cam kết sản phẩm:** chặn các yêu cầu truy cập/giải mã mới sau thời điểm có hiệu lực đã kiểm chứng. Không cam kết xóa bản rõ hoặc khóa mà người nhận đã giữ.

**8. Quản trị 2/3 và phiên bản bệnh án**

Tách hai cơ chế:

- **Tide QEA:** bảo vệ các thay đổi IAM nằm trong phạm vi nền tảng.
- **Medical Governance:** workflow CareVault phê duyệt đính chính bệnh án.

QEA không tự bao phủ mọi cập nhật PostgreSQL của ứng dụng. Tài liệu Tide mô tả quản trị IAM và ngưỡng hai người khi có ba quản trị viên. [docs.tide.org](https://docs.tide.org/Core-Concepts/iga-workflow?utm_source=chatgpt.com)

Mỗi yêu cầu đính chính gồm:

```text
request_id
record_id
base_version
proposed_version_hash
reason
panel_version
expires_at
status
```

Luồng xử lý:

1. Tạo phiên bản đề xuất, giữ nguyên bản hiện hành.
2. Cố định nội dung và hội đồng xét duyệt.
3. Mỗi thành viên xác thực bằng tài khoản riêng.
4. Ghi nhận quyết định gắn với đúng hash đề xuất.
5. Đủ hai phiếu hợp lệ thì chuyển `APPROVED`.
6. Áp dụng trong transaction, kiểm tra phiên bản gốc chưa thay đổi.
7. Tạo phiên bản mới và chuyển `APPLIED`.

Quy tắc:

- Một thành viên chỉ được tính một phiếu.
- Đổi nội dung phải tạo vòng duyệt mới.
- Không áp dụng hai lần cùng yêu cầu.
- Nếu phiên bản gốc đã thay đổi, yêu cầu phải được xem xét lại.
- Thay thành viên hội đồng cần hội đồng hiện hành phê duyệt.
- Không cấp quyền quản trị Tide realm chỉ vì một người là thành viên hội đồng.

**Mức bảo vệ cần công bố đúng:** workflow chặn sửa qua API. Để chống hoặc phát hiện sửa trực tiếp bởi quản trị viên database, cần bằng chứng phê duyệt có thể xác minh độc lập. Bằng chứng chữ ký cũng cần cơ chế kiểm tra phiên bản mới nhất để phát hiện việc đưa dữ liệu quay về bản cũ.

**9. Mô hình dữ liệu**

| Bảng | Nội dung |
|---|---|
| `users` | Liên kết danh tính Tide với tài khoản nghiệp vụ |
| `records` | Chủ hồ sơ, ID ổn định, trạng thái |
| `record_versions` | Ciphertext reference, hash, phiên bản trước |
| `access_grants` | Người nhận, thời hạn, trạng thái, tham chiếu chính sách |
| `grant_records` | Phiên bản tài liệu thuộc quyền chia sẻ |
| `panels`, `panel_members` | Hội đồng và phiên bản thành viên |
| `change_requests` | Đề xuất, hash, phiên bản gốc, trạng thái |
| `approvals` | Người duyệt, quyết định và bằng chứng |
| `audit_events` | Sự kiện, kết quả, thời điểm và ID liên kết |
| `outbox_jobs` | Tác vụ đồng bộ chính sách cần thử lại |

`outbox_jobs` giúp tránh tình trạng database đã đổi nhưng yêu cầu gửi sang hệ thống bên ngoài bị thất lạc. Các tác vụ phải có khả năng chạy lại mà không tạo tác dụng trùng lặp.

**10. Audit, vận hành và hiệu năng**

Nhật ký cần ghi:

- Cấp, thu hồi và hết hạn quyền.
- Truy cập được phép hoặc bị từ chối.
- Tạo đề xuất, biểu quyết và áp dụng phiên bản.
- Thay đổi hội đồng và chính sách.

Không ghi nội dung bệnh án hoặc token vào log. Phân biệt “API đã cấp ciphertext” với “giải mã thành công”; chỉ ghi nhận sự kiện thứ hai khi có nguồn bằng chứng phù hợp.

Để chạy hiệu quả:

- Tải ciphertext trực tiếp lên object storage bằng quyền ngắn hạn.
- Phân trang hồ sơ và audit.
- Index theo người nhận, tài liệu, trạng thái và thời hạn.
- Không cache dài hạn quyết định cho phép.
- Đo riêng độ trễ API, giải mã và thu hồi.
- Sao lưu database và ciphertext; diễn tập phục hồi.
- Khi dịch vụ mật mã không khả dụng, báo trạng thái rõ và không tự bỏ qua kiểm tra.

**11. Giao diện và demo thống nhất**

Giữ phong cách hiện đại đã chốt: nền sáng, teal–navy, typography rõ, component đồng nhất và responsive.

Sáu màn hình ưu tiên:

1. Tổng quan bệnh nhân.
2. Danh sách và chi tiết hồ sơ.
3. Chia sẻ và thu hồi.
4. Hồ sơ được chia sẻ của bác sĩ.
5. Hội đồng phê duyệt.
6. Lịch sử truy cập và phiên bản.

Demo bảo mật sử dụng tài khoản và phiên riêng. Role Switcher chỉ dành cho chế độ mô phỏng có nhãn rõ.

**12. Tiêu chí nghiệm thu**

| Kiểm tra | Kết quả yêu cầu |
|---|---|
| Bác sĩ được cấp quyền | Đọc đúng tài liệu được chọn |
| Bác sĩ khác hoặc bệnh nhân khác | Bị từ chối |
| Sửa ID trong request | Không vượt quyền |
| Lấy bản dump lưu trữ | Không thấy bản rõ của dữ liệu được bảo vệ |
| Thu hồi rồi thử lại bằng phiên/token cũ | Hành vi đúng giới hạn thu hồi đã công bố |
| Một phiếu phê duyệt | Không áp dụng |
| Hai phiếu từ hai người hợp lệ | Tạo phiên bản mới |
| Sửa nội dung sau khi duyệt | Phiếu cũ không còn áp dụng |
| Gửi lặp yêu cầu áp dụng | Không tạo phiên bản trùng |
| Mất kết nối lúc đồng bộ | Không báo thành công giả; thử lại an toàn |

**Thứ tự triển khai đã chốt:** chứng minh tích hợp Tide giữa hai người dùng → mã hóa và lưu hồ sơ → phân quyền chi tiết → thu hồi → workflow 2/3 → audit và kiểm thử → hoàn thiện demo.

Nhóm dùng bản này làm chuẩn phân công và phát triển; chỉ đánh dấu một công năng là **đã triển khai** khi có kết quả kiểm thử tương ứng.